<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yhteystiedot</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
      line-height: 1.6;
    }

    .page-scroll {
      height: 100vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
      padding: 24px 16px;
      box-sizing: border-box;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* YHDISTETTY YLÄKORTTI (Grid + Teksti) */
    .top-card,
    .form-box {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .top-card {
      margin-bottom: 22px;
      padding: 24px 20px;
      text-align: center;
    }

    /* 2x2 GRID LAYOUT */
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-areas: 
        "email address"
        "phone hours";
      gap: 12px;
      margin-bottom: 24px; /* Väli gridin ja otsikon välissä */
    }

    .item-email { grid-area: email; }
    .item-phone { grid-area: phone; }
    .item-address { grid-area: address; }
    .item-hours { grid-area: hours; }

    /* ULTRA-THIN PILL-SHAPED LIQUID GLASS */
    .glass-card {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 500;
      color: #ffffff;
      text-decoration: none;
      
      overflow: hidden;
      transform: translateZ(0); 
      -webkit-mask-image: -webkit-radial-gradient(white, black);
      
      background: linear-gradient(135deg, rgba(0, 0, 0, 0.95) 0%, rgba(25, 25, 25, 0.9) 75%, rgba(180, 180, 180, 0.25) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      
      border: none;
      box-shadow: 
        inset 0 0 0 1px rgba(255, 255, 255, 0.15),
        0 4px 12px rgba(0, 0, 0, 0.25),
        inset 0 1.5px 1px rgba(255, 255, 255, 0.2);
      
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), 
                  box-shadow 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), 
                  background 0.3s ease;
    }

    .glass-card:hover {
      transform: scale(1.02);
      background: linear-gradient(135deg, rgba(10, 10, 10, 0.98) 0%, rgba(35, 35, 35, 0.9) 75%, rgba(200, 200, 200, 0.3) 100%);
      box-shadow: 
        inset 0 0 0 1px rgba(255, 255, 255, 0.2),
        0 6px 16px rgba(0, 0, 0, 0.35),
        inset 0 1.5px 2px rgba(255, 255, 255, 0.3);
    }

    .glass-icon {
      width: 12px;
      height: 12px;
      fill: #ffffff; 
      flex-shrink: 0;
      filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.7)); 
      transition: filter 0.3s ease;
    }

    .glass-card:hover .glass-icon {
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 1)); 
    }

    .glass-text {
      white-space: nowrap; 
      overflow: hidden;
      text-overflow: ellipsis; 
      letter-spacing: -0.1px; 
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5); 
    }

    /* TEKSTIEN TYYLIT */
    .intro-title {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: 0.2px;
      text-transform: uppercase;
    }

    .intro-text {
      margin: 0 auto;
      max-width: 720px;
      font-size: 14px;
      line-height: 1.5;
      color: #444;
    }

    /* LOMAKE */
    .form-box {
      margin-bottom: 22px;
    }

    .form-frame {
      width: 100%;
      height: 900px;
      border: 0;
      display: block;
      background: #fff;
    }

    /* WhatsApp Floating Button */
    .wa-float {
      position: fixed;
      left: 20px;
      bottom: 20px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      overflow: hidden;
      transform: translateZ(0);
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .wa-glass {
      background: linear-gradient(145deg, rgba(60,60,60,.85), rgba(20,20,20,.95));
      border: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        inset 0 -10px 18px rgba(0,0,0,.6),
        0 10px 22px rgba(0,0,0,.6);
    }

    .wa-glass:hover {
      transform: scale(1.1) translateY(-2px);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.15),
        inset 0 -10px 18px rgba(0,0,0,.6),
        0 14px 28px rgba(0,0,0,.7);
    }

    .wa-icon {
      width: 32px;
      height: 32px;
      fill: white;
      z-index: 3;
      filter: drop-shadow(0 1px 1px rgba(0,0,0,.4));
    }

    .shine {
      position: absolute;
      inset: -60%;
      background: linear-gradient(120deg, transparent 40%, rgba(255,255,255,.4) 50%, transparent 60%);
      animation: shine 3s infinite;
      z-index: 1;
    }

    .pulse {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.25), transparent 60%);
      animation: pulse 2s infinite;
      z-index: 0;
    }

    @keyframes shine {
      from { transform: translateX(-40%); }
      to   { transform: translateX(40%); }
    }

    @keyframes pulse {
      0% { opacity: 0; transform: scale(.85); }
      30% { opacity: .4; }
      100% { opacity: 0; transform: scale(1.3); }
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
      .page-scroll {
        padding: 16px 12px;
      }

      .top-card {
        padding: 18px 14px;
        margin-bottom: 16px;
      }

      .contact-grid {
        gap: 6px; 
        margin-bottom: 20px;
      }

      .glass-card {
        padding: 4px 10px; 
        font-size: 10px; 
        gap: 5px;
      }

      .glass-icon {
        width: 10px; 
        height: 10px;
      }

      .form-frame {
        height: 980px;
      }

      .wa-float {
        left: 14px;
        bottom: 14px;
        width: 56px;
        height: 56px;
      }

      .wa-icon {
        width: 30px;
        height: 30px;
      }
    }
  </style>
</head>

<body>

    <div class="container">

      <div class="top-card">

        <p class="intro-text">
          Voit ottaa meihin yhteyttä millä tahansa sinulle sopivalla tavalla. Olemme tavoitettavissa 24/7 WhatsAppin tai sähköpostin kautta. Voit myös käyttää alla olevaa nopeaa yhteydenottolomaketta.

      </div>

      <!-- FORM BOX -->
      <div class="form-box">
        <iframe

          src="https://johnsimsek.github.io/Contact-form/"

          loading="lazy"></iframe>

    <!-- WHATSAPP BUTTON -->

</body>
</html>

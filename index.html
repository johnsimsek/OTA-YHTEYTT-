<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ota yhteyttä – Inky Vibes</title>

<style>
:root{
  --border:#d7dbe2;
  --text:#0f1115;
  --muted:#8c8f98;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family: system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
  background:#fff;
}
.wrap{
  max-width:560px;
  margin:auto;
  padding:28px 18px 40px;
}
h1{
  font-size:42px;
  font-weight:900;
  margin-bottom:12px;
}
.lead{
  font-size:18px;
  color:#5f636e;
  line-height:1.5;
  margin-bottom:22px;
}

.field{
  position:relative;
  margin-bottom:16px;
}

/* INPUTS */
.input,.textarea{
  width:100%;
  border:2px solid var(--border);
  border-radius:6px;
  font-size:18px;
  padding:18px 16px 18px 56px;
}
.input::placeholder,
.textarea::placeholder{
  color:var(--muted);
}

/* TEXTAREA FIX */
.textarea{
  min-height:180px;
  resize:none;
  padding-top:20px; /* text top */
}

/* ICONS */
.icon{
  position:absolute;
  left:18px;
  width:22px;
  height:22px;
  fill:#000;
}

/* input icons center */
.field.input-field .icon{
  top:50%;
  transform:translateY(-50%);
}

/* textarea icon top-left */
.field.textarea-field .icon{
  top:22px;
}

/* BUTTON */
button{
  margin-top:6px;
  padding:16px 28px;
  background:#000;
  color:#fff;
  border:none;
  font-weight:800;
  letter-spacing:.5px;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>

<body>
<main class="wrap">

<h1>OTA YHTEYTTÄ</h1>
<p class="lead">
Onko kysymyksiä? Käytä alla olevaa yhteydenottolomaketta ottaaksesi meihin yhteyttä.
Vastaamme sinulle mahdollisimman pian!
</p>

<form action="https://formspree.io/f/xlgweraj" method="POST">

<!-- NAME -->
<div class="field input-field">
<svg class="icon" viewBox="0 0 24 24">
  <path d="M12 12c2.7 0 4.8-2.2 4.8-4.9S14.7 2.2 12 2.2 7.2 4.4 7.2 7.1 9.3 12 12 12Zm0 2.2c-3.2 0-9.5 1.6-9.5 4.9v1.6h19v-1.6c0-3.3-6.3-4.9-9.5-4.9Z"/>
</svg>
<input class="input" name="name" placeholder="Nimi" required>
</div>

<!-- EMAIL -->
<div class="field input-field">
<svg class="icon" viewBox="0 0 24 24">
  <path d="M2 5.5v13h20v-13H2Zm10 6.1L3.5 6.9h17L12 11.6Z"/>
</svg>
<input class="input" type="email" name="email" placeholder="Sähköpostiosoite" required>
</div>

<!-- PHONE -->
<div class="field input-field">
<svg class="icon" viewBox="0 0 24 24">
  <path d="M6.6 10.8c1.6 3.1 3.6 5.1 6.7 6.7l2.2-2.2c.3-.3.7-.4 1.1-.3 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V21c0 .6-.4 1-1 1C10.3 22 2 13.7 2 3c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.3 1.1l-2.2 2.2Z"/>
</svg>
<input class="input" type="tel" name="phone" placeholder="Puhelin">
</div>

<!-- MESSAGE -->
<div class="field textarea-field">
<svg class="icon" viewBox="0 0 24 24">
  <path d="M4 3h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-4 4v-4H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/>
</svg>
<textarea class="textarea" name="message" placeholder="Viestisi" required></textarea>
</div>

<button type="submit">LÄHETÄ VIESTI</button>

</form>
</main>
</body>
</html>
